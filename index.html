<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* PHONE SIZE: on a phone set to Chrome's "Desktop site", the page is laid out 980 px wide and shrunk to fit, so everything looks tiny.
   On a touch screen, when the page is laid out wider than the screen itself, zoom it back to the screen's own width (normal phones: no change). */
(function () {
  function fit() {
    var touch = navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia("(pointer: coarse)").matches);
    var sw = screen.width || 0, iw = window.innerWidth || 0;
    var z = touch && sw > 0 && sw < 900 && iw > sw * 1.25 ? iw / sw : 1;
    document.documentElement.style.zoom = z > 1 ? String(Math.round(z * 1000) / 1000) : "";
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", function () { setTimeout(fit, 300); });
})();
</script>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B2550">
<title>RT Passbook</title>
<style>
/* VOICE: a trusted passbook from the lender, plain Filipino, large and calm for older readers
   IDEA: the old bank passbook: navy cover with gold lettering, ruled paper pages, rubber stamps
   PICTURE: the cover with the holder's name, then the stamped list of what to sign
   COLOUR and TYPE: RT navy and gold on warm paper; Georgia for the cover, Arial for everything else
   LAYOUT: one column up to 560px: cover, ngayong sweldo, balanse, pipirmahan, kasaysayan */
:root{--navy:#0B2550;--navy2:#071B3F;--gold:#B8873F;--gold2:#8C6424;--goldl:#D9B26A;--paper:#FFFDF8;--cream:#F6EFDF;--line:#E6DCC6;--ink:#1B2333;--muted:#5B6475;--green:#1E7B34;--red:#B42318;--amber:#9A4A00}
*{box-sizing:border-box;min-width:0}
html{background:#E9E2D2}
body{margin:0;color:var(--ink);font:17px/1.5 Arial,"Helvetica Neue",Roboto,sans-serif;overflow-x:clip}
.book{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 0 1px var(--line)}
.cover{background:var(--navy);color:#fff;padding:28px 22px 26px;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;inset:10px;border:1.5px solid rgba(217,178,106,.55);border-radius:6px;pointer-events:none}
.co{color:var(--goldl);font-weight:700;letter-spacing:.04em;font-size:15px}
.tag{color:#C9D3E6;font-size:13px;margin-top:2px}
.pb{font:700 40px/1.05 Georgia,"Times New Roman",serif;margin:18px 0 6px;color:#fff}
.who{font-size:21px;font-weight:700}
.sub{color:#C9D3E6;font-size:15px}
.asof{display:inline-block;margin-top:12px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;font-size:14px;color:#E8EDF7}
.band{padding:20px 18px}
h2{font:700 15px/1.2 Arial,sans-serif;color:var(--gold2);letter-spacing:.06em;margin:4px 0 12px;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.big{font:700 34px/1.1 Arial,sans-serif;color:var(--navy);white-space:nowrap}
.bigl{color:var(--muted);font-size:15px}
.rows{margin-top:12px}
.r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.r>span:first-child{flex:1 1 auto}.r .n{flex:none;text-align:right}
.card>.rows:first-child{margin-top:0}.card>.rows:first-child>.r:first-child{border-top:0;padding-top:0}
.r b{white-space:nowrap}
.r.tot{border-top:2px solid var(--navy);font-weight:700}
.r.less{background:#166534;color:#fff;font-weight:700;border-top:0;border-radius:8px;padding:9px 10px;margin:4px -6px}
.r .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.ok{background:#E3F4E6;color:var(--green)}.wait{background:#FFF0D9;color:var(--amber)}.bad{background:#FDE8E6;color:var(--red)}.calm{background:#E8EDF7;color:var(--navy)}
.alert{display:flex;gap:12px;align-items:center;background:var(--gold);color:#fff;border-radius:10px;padding:14px 16px;font-weight:700;border:0;width:100%;font-size:17px;text-align:left;min-height:56px;cursor:pointer}
.alert span{flex:1}
.bars{display:grid;gap:10px;margin-top:6px}
.bar{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.trk{display:grid;gap:4px}
.b1,.b2{height:12px;border-radius:3px}
.b1{background:var(--cream);border:1.5px solid var(--gold)}
.b2{background:var(--navy)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer;position:relative;min-height:64px}
.item .t{font-weight:700;padding-right:116px}
.item .m{color:var(--muted);font-size:15px;margin-top:2px}
.stampx{position:absolute;right:12px;top:12px;border:2.5px solid currentColor;border-radius:6px;padding:2px 8px;font:700 13px/1.3 Arial,sans-serif;transform:rotate(-6deg);letter-spacing:.04em;background:rgba(255,255,255,.7)}
.s-SIGNED{color:var(--green)}.s-DEEMED{color:var(--gold2)}.s-PENDING{color:var(--red)}.s-CONCERN{color:var(--amber)}.s-VOID{color:#8A93A3}
.hist{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;padding:12px 14px;align-items:start;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .d{color:var(--muted);font-size:14px;line-height:1.3}
.hist .x{font-size:16px;line-height:1.35}
.hist .x small{display:block;color:var(--muted);font-size:13px}
.hist .a{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .in{color:var(--green)}.hist .out{color:var(--navy)}
.empty{color:var(--muted);font-size:15px;padding:12px 2px}
.foot{padding:18px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.msg{padding:48px 22px;text-align:center}
.msg p{font-size:18px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(7,27,63,.55);display:flex;justify-content:center;align-items:flex-end;z-index:9}
.sheet[hidden]{display:none}
.pane{background:var(--paper);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.close{border:0;background:var(--cream);color:var(--navy);font:700 16px Arial;border-radius:999px;min-width:48px;min-height:48px;padding:0 16px;cursor:pointer}
.doc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0}
.doc h3{margin:0 0 10px;font:700 19px/1.3 Georgia,serif;color:var(--navy)}
.doc p{margin:0 0 10px}
.signers{margin:12px 0}
.sg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.padw{background:#fff;border:2px dashed var(--gold);border-radius:10px;position:relative;height:190px;touch-action:none}
.padw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padw .ph{position:absolute;left:14px;bottom:10px;color:#A9A08C;font-size:14px;pointer-events:none}
.check{display:flex;gap:12px;align-items:flex-start;margin:14px 0;font-size:16px}
.check input{width:26px;height:26px;flex:none;margin-top:2px}
.btn{display:block;width:100%;min-height:54px;border-radius:10px;border:0;font:700 18px Arial,sans-serif;cursor:pointer;margin-top:10px}
.pri{background:var(--navy);color:#fff}.pri:disabled{background:#9AA3B2;cursor:not-allowed}
.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.lite{background:var(--cream);color:var(--navy)}
textarea{width:100%;min-height:110px;font:17px/1.4 Arial,sans-serif;padding:12px;border:2px solid var(--line);border-radius:10px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.thread{margin:10px 0;padding:10px 12px;border-left:4px solid var(--amber);background:#FFF8EC;border-radius:6px;font-size:15px}
.thread.v{border-color:var(--navy);background:#EEF2F9}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* loan application */
.ap label{display:block;font-weight:700;font-size:16px;margin:14px 0 6px}
.ap label small{font-weight:400;color:var(--muted)}
.ap input[type=text],.ap input[type=tel],.ap input[type=number],.ap select{width:100%;min-height:52px;font:18px Arial,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.ap textarea{min-height:84px}
.ap .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ap .two label{margin-top:0}
.ap .due{margin-top:8px;padding:10px 12px;border-radius:10px;background:#EEF2F9;color:var(--navy);font-weight:700}
.ap .miss{border-color:var(--red)!important}
.ap label.check{font-weight:400;font-size:16px}
.ap .err{color:var(--red);font-weight:700;margin-top:10px}
.ap h3{font:700 15px/1.2 Arial,sans-serif;color:var(--gold2);letter-spacing:.06em;margin:22px 0 2px;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.pane{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="book" id="app"><div class="msg"><p>Binubuksan ang passbook…</p></div></div>
<div class="sheet" id="sheet" hidden><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>
<script src="core.js"></script>
<script>
{
const $ = (s) => document.querySelector(s), E = RT.esc, P$ = RT.peso;
const app = $("#app"), sheet = $("#sheet"), pane = $("#pane");
let S = null; // {link,pid,D,P,mem}

function shell(inner) { app.innerHTML = inner; }
function fail(title, text) {
  shell('<div class="cover"><div class="co">RT LENDING CORP.</div><div class="pb">Passbook</div></div>' +
        '<div class="msg"><p><b>' + E(title) + '</b></p><p>' + E(text) + '</p></div>');
}

async function boot() {
  const link = location.hash.replace(/^#/, "");
  if (link === "apply") return applyPage();
  if (!/^[A-Za-z0-9_-]{20,40}$/.test(link)) return fail("Buksan ang sariling link mo.", "Ang link ay ipinapadala ng RT LENDING CORP. sa Messenger. Para sa iyo lang ito.");
  let D;
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0;
    D = await r.json();
  } catch (_) { return fail("Wala pang datos.", "Subukan ulit mamaya."); }
  const pid = await RT.pidOf(link), box = D.people && D.people[pid];
  if (!box) return fail("Hindi makita ang passbook.", "Maaaring luma na ang link. Humingi ng bagong link sa RT LENDING CORP.");
  let P;
  try { P = await RT.open(await RT.aesKey(link), box); } catch (_) { return fail("Hindi mabuksan ang passbook.", "Humingi ng bagong link sa RT LENDING CORP."); }
  S = { link, pid, D, P, mem: RT.get("rt:" + pid, { sig: {}, ask: {}, queue: [] }) };
  render();
  flush();
}

/* merge what this phone already sent (waiting for the next update from the admin) */
function itemsNow() {
  const me = S.P.viewer.name;
  return S.P.items.map((it) => {
    const x = JSON.parse(JSON.stringify(it));
    const ls = S.mem.sig[it.id];
    if (ls && !(x.sigs && x.sigs[me])) { x.sigs = x.sigs || {}; x.sigs[me] = { at: ls.at, path: ls.path, local: ls.sent ? 1 : 2 }; }
    const la = S.mem.ask[it.id] || [];
    la.forEach((a) => { if (!(x.concerns || []).some((c) => c.at === a.at)) { x.concerns = x.concerns || []; x.concerns.push({ at: a.at, by: me, msg: a.msg, local: 1 }); } });
    return x;
  });
}
const days = () => S.P.days || 7;

function stamp(st) { return '<span class="stampx s-' + st.code + '">' + E(st.label) + "</span>"; }
function stLine(st) {
  if (st.code === "SIGNED") return "Pinirmahan noong " + RT.stamp(st.at);
  if (st.code === "DEEMED") return "Tinanggap noong " + RT.stamp(st.at) + " (walang pirma o tutol sa loob ng " + days() + " araw)";
  if (st.code === "CONCERN") return "Hinihintay ang sagot ng RT LENDING CORP.";
  if (st.code === "VOID") return "Kinansela ng RT LENDING CORP.";
  return st.left + " araw na lang. Kapag walang pirma o tutol, ituturing na TINANGGAP sa " + RT.stamp(st.due) + ".";
}

function rows(list) {
  return '<div class="rows">' + list.filter(Boolean).map((r) => '<div class="r' + (r[2] === 2 ? " less" : r[2] ? " tot" : "") + '"><span>' + E(r[0]) + '</span><span class="n">' + E(r[1]) + "</span></div>").join("") + "</div>";
}

function bars(data, a, b) {
  const max = Math.max(1, ...data.map((d) => Math.max(d.a || 0, d.b || 0)));
  return '<div class="bars">' + data.map((d) =>
    '<div class="bar"><span>' + E(d.label) + '</span><div class="trk">' +
    (a ? '<div class="b1" style="width:' + Math.max(2, (d.a || 0) / max * 100) + '%" title="' + E(a + " " + P$(d.a)) + '"></div>' : "") +
    '<div class="b2" style="width:' + Math.max(2, (d.b || 0) / max * 100) + '%" title="' + E(b + " " + P$(d.b)) + '"></div></div></div>').join("") +
    '</div><div class="legend">' + (a ? '<span><i style="background:#F6EFDF;border:1.5px solid #B8873F"></i>' + E(a) + "</span>" : "") + '<span><i style="background:#0B2550"></i>' + E(b) + "</span></div>";
}

function render() {
  const P = S.P, A = P.acct, now = Date.now(), its = itemsNow();
  const sts = its.map((it) => ({ it, st: RT.status(it, now, days()) }));
  const me = P.viewer.name;
  const todo = sts.filter((x) => x.st.code === "PENDING" && RT.need(x.it).includes(me) && !(x.it.sigs && x.it.sigs[me]));
  let h = '<div class="cover"><div class="co">' + E(P.co.name) + '</div><div class="tag">' + E(P.co.tagline) + "</div>" +
    '<div class="pb">Passbook</div><div class="who">' + E(A.name) + "</div>" +
    '<div class="sub">' + E(A.type === "B" ? A.id + (A.school ? " · " + A.school : "") : A.type === "I" ? "Co-investor" : "Taga-withdraw") +
    (me !== A.name ? " · binubuksan ni " + E(me) : "") + "</div>" +
    '<div class="asof">Hanggang ' + E(RT.dLabel(P.asof)) + "</div>" +
    (A.status && A.status !== "ACTIVE" ? '<div class="asof" style="margin-left:8px">' + E(A.status) + "</div>" : "") + "</div>";
  if (todo.length) h += '<div class="band" style="padding-bottom:0"><button class="alert" data-go="sign"><span>May ' + todo.length + " pipirmahan</span>›</button></div>";

  if (A.type === "B") {
    const p = A.period;
    h += '<section class="band"><h2>Ngayong sweldo · ' + E(p.label) + "</h2><div class=\"card\">" +
      '<div class="bigl">Ipinadala sa iyo</div><div class="big">' + P$(p.sent) + "</div>" +
      '<div style="margin-top:8px"><span class="chip ' + (p.status === "BAYAD NA" || p.status === "PAID" ? "ok" : p.kulang > 0.004 ? "bad" : "wait") + '">' + E(p.statusText) + "</span></div>" +
      rows([["Sweldo na pumasok", p.salary > 0 ? P$(p.salary) : "wala pa"], ["Dues (" + A.ratePct + " ng utang)", P$(p.due)], p.bint ? ["Bonus interest", P$(p.bint)] : null,
            p.arr ? ["ARREARS, surcharge at extra singil", P$(p.arr)] : null, p.less > 0.004 ? ["December LESS", "− " + P$(p.less), 2] : null, ["Dapat ikaltas", P$(p.tdue), 1], ["Nakaltas", P$(p.coll)], p.kulang > 0.004 ? ["Kulang pa", P$(p.kulang)] : null]) + "</div></section>";
    h += '<section class="band" style="padding-top:0"><h2>Balanse</h2><div class="card">' +
      rows([["Regular na utang", P$(A.principal)], ["Kaltas kada sweldo", P$(A.duePerPay)],
            ...A.bonuses.map((b) => [b.type + " · bayad ang dues hanggang " + RT.dLabel(b.paidThru), P$(b.left)]),
            A.unpaid > 0.004 ? ["Dues na hindi pa nakakaltas (kasama ang surcharge kung mayroon)", P$(A.unpaid)] : null, ["Kabuuang utang", P$(A.total), 1]]) + "</div></section>";
    if (A.graph.length) h += '<section class="band" style="padding-top:0"><h2>Huling ' + A.graph.length + " sweldo</h2><div class=\"card\">" + bars(A.graph.map((g) => ({ label: g.label, a: g.dapat, b: g.nakaltas })), "Dapat ikaltas", "Nakaltas") + "</div></section>";
  } else if (A.type === "I") {
    const k = A.perPay;
    h += '<section class="band"><h2>Kita mo ngayong sweldo · ' + E(P.period) + "</h2><div class=\"card\">" +
      '<div class="bigl">Iaabot sa iyo</div><div class="big">' + P$(k.cash) + "</div>" +
      '<div style="margin-top:8px"><span class="chip ' + (k.short <= 0.004 && k.given > 0 ? "ok" : "wait") + '">' + (k.short <= 0.004 && k.given > 0 ? "Naibigay na" : "Hindi pa naibibigay · " + P$(k.short)) + "</span></div>" +
      rows([["Interest: " + A.ratePct + " kada buwan ng " + P$(A.capital) + " ÷ 2", P$(k.interest)], k.benefit ? ["Benefit sa RT LENDING CORP.", "− " + P$(k.benefit)] : null,
            k.allowance ? ["Allowance" + (k.allowFor ? " para sa " + k.allowFor : "") + (k.allowFrom ? " (mula sa " + P$(k.allowFrom) + ")" : ""), "− " + P$(k.allowance)] : null,
            ["Ibibigay kada sweldo", P$(k.give), 1], k.singil ? ["Extra singil", "− " + P$(k.singil)] : null]) + "</div></section>";
    h += '<section class="band" style="padding-top:0"><h2>Puhunan</h2><div class="card">' +
      rows([["Puhunan ngayon", P$(A.capital)], ["Interest kada buwan", A.ratePct], ["Payouts na natanggap", P$(A.toDate.payouts)],
            A.toDate.capIn ? ["Dagdag puhunan", P$(A.toDate.capIn)] : null, A.toDate.capOut ? ["Ibinalik na puhunan", P$(A.toDate.capOut)] : null]) + "</div></section>";
    if (A.graph.length) h += '<section class="band" style="padding-top:0"><h2>Payouts</h2><div class="card">' + bars(A.graph.map((g) => ({ label: g.label, b: g.amt })), "", "Payout") + "</div></section>";
  } else {
    const m = A.month;
    h += '<section class="band"><h2>Ngayong buwan · ' + E(m.label) + "</h2><div class=\"card\">" +
      '<div class="bigl">Kabuuan para sa iyo</div><div class="big">' + P$(m.net) + "</div>" +
      rows([["Withdraw ng SWELDO × " + m.nSal + " (" + P$(A.feeSal) + " bawat isa)", P$(m.fSal)], m.nBon ? ["Withdraw ng BONUS × " + m.nBon + " (" + P$(A.feeBon) + " bawat isa)", P$(m.fBon)] : null,
            m.extra ? ["Extra", P$(m.extra)] : null, m.singil ? ["Singil", "− " + P$(m.singil)] : null, ["Kabuuan", P$(m.net), 1]]) + "</div></section>";
  }

  sts.sort((a, b) => (a.st.code === "PENDING" ? 0 : a.st.code === "CONCERN" ? 1 : 2) - (b.st.code === "PENDING" ? 0 : b.st.code === "CONCERN" ? 1 : 2) || b.it.sent - a.it.sent);
  h += '<section class="band" id="sign" style="padding-top:0"><h2>Pipirmahan</h2>' + (sts.length ? sts.map((x) =>
    '<button class="item" data-item="' + E(x.it.id) + '"><div class="t">' + E(x.it.title) + "</div>" + stamp(x.st) +
    '<div class="m">' + E(stLine(x.st)) + "</div></button>").join("") : '<div class="empty">Wala pang pipirmahan.</div>') + "</section>";

  h += '<section class="band" style="padding-top:0"><h2>Kasaysayan</h2>' + (A.history.length ? '<ul class="hist">' + A.history.map((x) =>
    '<li><span class="d">' + E(RT.dLabel(x.date).replace(/, \d{4}$/, "")) + "<br>" + E(x.date.slice(0, 4)) + '</span><span class="x">' + E(x.text) +
    (x.sub ? "<small>" + E(x.sub) + "</small>" : "") + '</span><span class="a ' + (x.dir === "in" ? "in" : "out") + '">' + P$(x.amt) + "</span></li>").join("") + "</ul>"
    : '<div class="empty">Wala pang transaksyon.</div>') + "</section>";

  h += '<div class="foot">' + (A.type === "B" && P.co.pay ? "Pambayad: " + E(P.co.pay) + "<br>" : "") +
    "Para sa iyo lang ang passbook na ito. Huwag ibahagi ang link.<br>Na-update: " + E(RT.stamp(P.updated)) + "<br>Prepared by: " + E(P.co.name) + "</div>";
  shell(h);
}

/* ---------- one item ---------- */
function openItem(id) {
  const it = itemsNow().find((x) => x.id === id); if (!it) return;
  const me = S.P.viewer.name, st = RT.status(it, Date.now(), days()), need = RT.need(it);
  const mine = it.sigs && it.sigs[me], canSign = need.includes(me) && !mine && st.code !== "VOID" && st.code !== "SIGNED";
  let h = '<div class="top"><span class="chip ' + ({ SIGNED: "ok", DEEMED: "calm", CONCERN: "wait", PENDING: "bad", VOID: "calm" }[st.code]) + '">' + E(st.label) + '</span><button class="close" data-close>Isara</button></div>' +
    '<div class="doc"><h3>' + E(it.title) + "</h3>" + it.lines.map((l) => "<p>" + E(l) + "</p>").join("") + "</div>" +
    '<div class="note">' + E(stLine(st)) + "</div>" +
    '<div class="signers">' + need.map((n) => '<div class="sg"><span>' + E(n) + (it.roles && it.roles[n] ? " · " + E(it.roles[n]) : "") + "</span><b>" +
      (it.sigs && it.sigs[n] ? "Pumirma · " + E(RT.stamp(it.sigs[n].at)) + (it.sigs[n].local === 1 ? " (naipadala)" : it.sigs[n].local === 2 ? " (hindi pa naipadala)" : "") : "Wala pang pirma") + "</b></div>").join("") + "</div>";
  (it.concerns || []).forEach((c) => {
    h += '<div class="thread">' + E(c.by) + " · " + E(RT.stamp(c.at)) + "<br>" + E(c.msg) + (c.local ? "<br><i>Naipadala sa RT LENDING CORP.</i>" : "") + "</div>";
    if (c.reply) h += '<div class="thread v">Sagot ng RT LENDING CORP. · ' + E(RT.stamp(c.replyAt || c.at)) + "<br>" + E(c.reply) + "</div>";
  });
  if (canSign) {
    h += '<h2 style="margin-top:18px">Pirma mo</h2><div class="padw"><canvas id="pad" aria-label="Pirmahan dito gamit ang daliri"></canvas><span class="ph">Pumirma dito gamit ang daliri</span></div>' +
      '<button class="btn lite" id="clr" type="button">Burahin at ulitin</button>' +
      '<label class="check"><input type="checkbox" id="agree"><span>Nabasa ko at sumasang-ayon ako. Alam kong hindi na mababago o mabubura ang pirma ko.</span></label>' +
      '<button class="btn pri" id="go" disabled>PUMIRMA</button>';
  }
  if (st.code !== "VOID") h += '<button class="btn sec" id="ask">May tanong o tutol</button><div id="askbox"></div>';
  h += '<button class="btn lite" id="copy">I-save ang kopya (JPEG)</button><div class="note" id="say"></div>';
  pane.innerHTML = h; sheet.hidden = false; pane.scrollTop = 0;
  let pad = null;
  if (canSign) {
    const go = $("#go"), agree = $("#agree");
    const upd = () => { go.disabled = !(pad && pad.ink() > 3 && agree.checked); };
    pad = RT.pad($("#pad"), upd); agree.onchange = upd;
    $("#clr").onclick = () => pad.clear();
    go.onclick = () => sign(it, pad.path());
  }
  const ask = $("#ask");
  if (ask) ask.onclick = () => {
    $("#askbox").innerHTML = '<textarea id="q" placeholder="Isulat ang tanong o tutol mo"></textarea><button class="btn pri" id="send">IPADALA SA RT LENDING CORP.</button>';
    $("#q").focus();
    $("#send").onclick = () => { const m = $("#q").value.trim(); if (m.length < 2) return; concern(it, m); };
  };
  $("#copy").onclick = () => saveCopy(it, st);
}

async function post(kind, it, extra) {
  const me = S.P.viewer.name, at = Date.now(), hash = await RT.itemHash(it);
  const data = { v: 1, k: kind, item: it.id, pid: S.pid, name: me, at, hash };
  Object.assign(data, extra);
  data.proof = await RT.proof(S.link, [kind, it.id, S.pid, me, at, hash, kind === "SIGN" ? data.svg : data.msg]);
  const form = S.D.form && (kind === "SIGN" ? S.D.form.sign : S.D.form.concern);
  const label = kind === "SIGN" ? "PUMIRMA: " + it.title : data.msg + " · " + it.title;
  try { await RT.send(form, me, label, data); return { at, sent: true }; }
  catch (e) { S.mem.queue.push({ kind, label, data }); return { at, sent: false, why: e && e.message }; }
}

async function sign(it, path) {
  $("#go").disabled = true; $("#go").textContent = "Ipinapadala…";
  const r = await post("SIGN", it, { svg: path });
  S.mem.sig[it.id] = { at: r.at, path, sent: r.sent }; RT.put("rt:" + S.pid, S.mem);
  render(); openItem(it.id);
  $("#say").textContent = r.sent ? "Naipadala sa RT LENDING CORP. ang pirma mo. Puwede mo ring i-save ang kopya." :
    (r.why === "noform" ? "Naitala sa phone na ito. Hindi pa bukas ang pagpapadala online; ipapaalam sa RT LENDING CORP." : "Walang internet. Ipapadala ito pagbukas mo ulit ng passbook.");
}

async function concern(it, msg) {
  $("#send").disabled = true;
  const r = await post("CONCERN", it, { msg });
  (S.mem.ask[it.id] = S.mem.ask[it.id] || []).push({ at: r.at, msg }); RT.put("rt:" + S.pid, S.mem);
  render(); openItem(it.id);
  $("#say").textContent = r.sent ? "Naipadala sa RT LENDING CORP. Hihinto ang bilang ng " + days() + " araw hanggang masagot ka." : "Hindi pa naipadala. Susubukan ulit pagbukas mo ng passbook.";
}

async function flush() {
  if (!S.mem.queue.length) return;
  const left = [];
  for (const q of S.mem.queue) {
    const form = S.D.form && (q.kind === "SIGN" ? S.D.form.sign : S.D.form.concern);
    try { await RT.send(form, q.data.name, q.label, q.data); if (q.kind === "SIGN" && S.mem.sig[q.data.item]) S.mem.sig[q.data.item].sent = true; } catch (_) { left.push(q); }
  }
  S.mem.queue = left; RT.put("rt:" + S.pid, S.mem);
}

async function saveCopy(it, st) {
  const need = RT.need(it);
  const blob = await RT.copyJpeg({
    co: S.P.co.name, tagline: S.P.co.tagline, title: it.title, lines: it.lines, holder: S.P.acct.name, role: S.P.acct.type === "B" ? S.P.acct.id : "",
    sigs: need.map((n) => ({ name: n, role: it.roles && it.roles[n], at: it.sigs && it.sigs[n] && it.sigs[n].at, path: it.sigs && it.sigs[n] && it.sigs[n].path })),
    status: { code: st.code, text: st.label + (st.at ? " · " + RT.stamp(st.at) : "") }, code: await RT.itemHash(it), id: it.id
  });
  const name = "RT PAGKILALA " + S.P.acct.name.replace(/[^A-Z0-9 ]/gi, "") + " " + RT.ymd(Date.now()) + ".jpg";
  const file = new File([blob], name, { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: it.title }); return; } catch (_) {}
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  $("#say").textContent = "Na-save ang kopya: " + name;
}

/* ---------- LOAN APPLICATION (#apply): a form with a signature pad, sent to RT LENDING CORP. through the Passbook Signatures form ---------- */
const AQ = "rt:apply:queue";
async function applyPage() {
  let D = {};
  try { const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) D = await r.json(); } catch (_) {}
  const cfg = D.apply || {}, co = cfg.co || "RT LENDING CORP.", rate = +cfg.rate || 0.025, form = D.form && D.form.sign;
  document.title = "Loan Application · " + co;
  const F = (id, label, type, hint, ex) => '<label for="' + id + '">' + label + (hint ? " <small>" + hint + "</small>" : "") + "</label>" +
    (type === "area" ? '<textarea id="' + id + '"' + (ex || "") + "></textarea>" : '<input type="' + (type || "text") + '" id="' + id + '"' + (ex || "") + ">");
  shell('<div class="cover"><div class="co">' + E(co) + '</div><div class="tag">' + E(cfg.tagline || "") + '</div><div class="pb">Loan Application</div>' +
    '<div class="sub">Punan ang form, pumirma sa dulo, at i-tap ang IPADALA ANG APPLICATION.</div></div>' +
    '<section class="band ap"><div class="card">' +
    '<label for="a_uri">Anong loan?</label><select id="a_uri"><option value="">Pumili</option><option>Bagong loan</option><option>Dagdag sa loan</option><option>Bonus advance (MYB, YEB at iba pa)</option></select>' +
    "<h3>Ikaw</h3>" + F("a_sur", "Apelyido", "text", "", ' autocomplete="family-name"') + F("a_first", "Pangalan", "text", "", ' autocomplete="given-name"') +
    F("a_mid", "Gitnang pangalan", "text", "kung mayroon", ' autocomplete="additional-name"') +
    F("a_mob", "Mobile number", "tel", "", ' inputmode="tel" autocomplete="tel"') + F("a_msg", "Pangalan sa Messenger", "text", "para makausap ka namin") +
    F("a_addr", "Tirahan", "area") +
    "<h3>Trabaho at sweldo</h3>" + F("a_sch", "Paaralan / Opisina") + F("a_pos", "Posisyon") + F("a_bank", "Bangko ng sweldo (ATM)") +
    F("a_net", "Net pay kada sweldo (₱)", "number", "", ' inputmode="decimal" min="0"') +
    F("a_gc", "GCash number", "tel", "dito ipapadala ang sobra ng sweldo", ' inputmode="tel"') + F("a_gcn", "Pangalan sa GCash") +
    "<h3>Loan</h3>" + F("a_amt", "Halagang hihiramin (₱)", "number", "", ' inputmode="decimal" min="0"') + '<div class="due" id="a_due" hidden></div>' +
    F("a_why", "Para saan", "area") + F("a_debt", "Ibang utang ngayon", "area", "kung mayroon") +
    '<label class="check"><input type="checkbox" id="a_ok"><span>Totoo ang lahat ng nakasulat dito. Pumapayag ako na gamitin ng ' + E(co) +
    " ang personal kong datos para lamang sa application at pautang na ito, ayon sa Data Privacy Act of 2012 (RA 10173).</span></label>" +
    '<label>Pirma</label><div class="padw" id="a_padw"><canvas id="a_pad"></canvas><span class="ph">Pumirma rito</span></div>' +
    '<button class="btn lite" id="a_clr" type="button">BURAHIN ANG PIRMA</button>' +
    '<p class="err" id="a_err" hidden></p><button class="btn pri" id="a_go" type="button">IPADALA ANG APPLICATION</button>' +
    '<p class="note">Walang hinihinging ATM PIN dito.</p></div></section><div class="foot">' + E(co) + "</div>");
  const pad = RT.pad($("#a_pad"), () => { $("#a_padw .ph").hidden = pad && pad.ink() > 0; });
  $("#a_clr").onclick = () => pad.clear();
  const amt = $("#a_amt");
  amt.oninput = () => {
    const v = +amt.value || 0, d = $("#a_due");
    d.hidden = !(v > 0);
    d.textContent = "Dues: " + Math.round(rate * 1000) / 10 + "% ng " + P$(v) + " = " + P$(Math.round(v * rate * 100) / 100) + " kada sweldo (ika-15 at katapusan ng buwan)";
  };
  const need = ["a_uri", "a_sur", "a_first", "a_mob", "a_sch", "a_net", "a_amt"];
  const clear = (e) => { if (e.target.classList) e.target.classList.remove("miss"); $("#a_err").hidden = true; };
  app.addEventListener("input", clear); app.addEventListener("change", clear);
  $("#a_go").onclick = async () => {
    const val = (id) => String($("#" + id).value || "").trim();
    need.forEach((id) => $("#" + id).classList.toggle("miss", !val(id)));
    const err = $("#a_err"), miss = need.filter((id) => !val(id));
    err.hidden = true;
    if (miss.length) { err.textContent = "Punan ang may pulang guhit."; err.hidden = false; $("#" + miss[0]).scrollIntoView({ block: "center" }); return; }
    if (!$("#a_ok").checked) { err.textContent = "I-tsek ang pagpayag sa itaas ng pirma."; err.hidden = false; return; }
    if (pad.ink() < 5) { err.textContent = "Pumirma sa kahon."; err.hidden = false; return; }
    if (!form) { err.textContent = "Hindi pa bukas ang application. Subukan ulit mamaya."; err.hidden = false; return; }
    const a = { uri: val("a_uri"), sur: val("a_sur").toUpperCase(), first: val("a_first").toUpperCase(), mid: val("a_mid").toUpperCase(), mob: val("a_mob"), msgr: val("a_msg"),
      addr: val("a_addr"), sch: val("a_sch"), pos: val("a_pos"), bank: val("a_bank"), net: +val("a_net") || 0, gc: val("a_gc"), gcn: val("a_gcn").toUpperCase(),
      amt: +val("a_amt") || 0, why: val("a_why"), debt: val("a_debt") };
    const at = Date.now(), d = { t: "APP", v: 1, id: "APP-" + RT.b64u(crypto.getRandomValues(new Uint8Array(6))), at, a, sig: pad.path() };
    const name = [a.first, a.mid, a.sur].filter(Boolean).join(" ");
    const q = RT.get(AQ, []); q.push({ name, d }); RT.put(AQ, q);
    $("#a_go").disabled = true; $("#a_go").textContent = "Ipinapadala…";
    await applyFlush(form);
    applyDone(co, name, d);
  };
  applyFlush(form);
}
async function applyFlush(form) {
  if (!form) return;
  const q = RT.get(AQ, []), left = [];
  for (const x of q) {
    try { await RT.send(form, x.name, "LOAN APPLICATION · " + P$(x.d.a.amt), x.d); } catch (_) { left.push(x); }
  }
  RT.put(AQ, left);
}
function applyDone(co, name, d) {
  const sent = !RT.get(AQ, []).some((x) => x.d.id === d.id), a = d.a;
  shell('<div class="cover"><div class="co">' + E(co) + '</div><div class="pb">Loan Application</div><div class="who">' + E(name) + "</div></div>" +
    '<section class="band"><div class="card"><p><span class="chip ' + (sent ? "ok" : "wait") + '">' + (sent ? "Natanggap na" : "Ipapadala kapag may internet na") + "</span></p>" +
    "<p>" + (sent ? "Salamat! Natanggap ng " + E(co) + " ang application mo. Imemensahe ka namin." : "Naka-save sa phone na ito. Buksan ulit ang link na ito kapag may internet na, at kusa itong maipapadala.") + "</p>" +
    rows([["Loan", a.uri], ["Halaga", P$(a.amt)], ["Petsa", RT.stamp(d.at)]]) +
    '<button class="btn sec" id="a_copy">I-SAVE ANG KOPYA (JPEG)</button><p class="note" id="say"></p></div></section>');
  $("#a_copy").onclick = async () => {
    const blob = await RT.copyJpeg({ head: "APPLICATION", co, tagline: "", title: "LOAN APPLICATION · " + a.uri, holder: name, role: "Aplikante",
      lines: appLines(a), sigs: [{ name, role: "Aplikante", at: d.at, path: d.sig }], status: { code: "SIGNED", text: sent ? "IPINADALA" : "NAKA-SAVE SA PHONE" }, code: d.id, id: RT.stamp(d.at) });
    const fn = "LOAN APPLICATION " + name + " " + RT.ymd(d.at) + ".jpg", file = new File([blob], fn, { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (_) {} }
    const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = fn; document.body.appendChild(l); l.click(); l.remove();
    $("#say").textContent = "Na-save ang kopya: " + fn;
  };
}
function appLines(a) {
  return ["Halagang hihiramin: " + P$(a.amt) + (a.why ? " · Para sa: " + a.why : ""), "Mobile: " + a.mob + (a.msgr ? " · Messenger: " + a.msgr : ""),
    a.addr ? "Tirahan: " + a.addr : "", "Paaralan / Opisina: " + a.sch + (a.pos ? " · " + a.pos : ""), (a.bank ? "Bangko ng sweldo: " + a.bank + " · " : "") + "Net pay kada sweldo: " + P$(a.net),
    a.gc ? "GCash: " + a.gc + (a.gcn ? " (" + a.gcn + ")" : "") : "", a.debt ? "Ibang utang: " + a.debt : "",
    "Totoo ang lahat ng nakasulat dito, at pumapayag ako sa paggamit ng personal kong datos para lamang sa application at pautang na ito."].filter(Boolean);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-item],[data-close],[data-go]");
  if (!t) { if (e.target === sheet) sheet.hidden = true; return; }
  if (t.dataset.item) openItem(t.dataset.item);
  else if (t.hasAttribute("data-close")) sheet.hidden = true;
  else if (t.dataset.go) document.getElementById(t.dataset.go).scrollIntoView({ behavior: "smooth" });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") sheet.hidden = true; });
window.addEventListener("hashchange", () => location.reload());
boot();
}
</script>
