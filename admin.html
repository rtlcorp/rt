/* PHONE SIZE: on a phone set to Chrome's "Desktop site", the page is laid out 980 px wide and shrunk to fit, so everything looks tiny.
   On a touch screen, when the page is laid out wider than the screen itself, zoom it back to the screen's own width (normal phones: no change). */
(function () {
  function fit() {
    var touch = navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia("(pointer: coarse)").matches);
    var sw = screen.width || 0, iw = window.innerWidth || 0;
    var z = touch && sw > 0 && sw < 900 && iw > sw * 1.25 ? iw / sw : 1;
    document.documentElement.style.zoom = z > 1 ? String(Math.round(z * 1000) / 1000) : "";
  }
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", function () { setTimeout(fit, 300); });
})();

<script>
{
const $ = (s) => document.querySelector(s), E = RT.esc, P$ = RT.peso, enc = new TextEncoder();
const app = $("#app");
const BASE = location.origin + location.pathname.replace(/admin\.html.*$/, "");
const REPO = (() => { const o = location.hostname.split(".")[0], r = location.pathname.split("/").filter(Boolean)[0]; return location.hostname.endsWith("github.io") && r ? "https://github.com/" + o + "/" + r + "/upload/main" : ""; })();
let D = null, MASTER = null, AKEY = null, ST = null, LINKS = {}, MSG = "";

const TPL = {
  B: "Ako si «PANGALAN» («ID»), borrower ng «CO».\n" +
     "1. Kinikilala ko na hanggang «PETSA», ang utang ko ay: regular na utang «PRINCIPAL»; bonus advance «BONUS»; hindi pa bayad na dues (kasama ang surcharge) «KULANG».\n" +
     "2. Ang dues ay «RATE» ng regular na utang kada sweldo («RATE_BUWAN» kada buwan), kinakaltas sa sweldo ko tuwing ika-15 at katapusan ng buwan. Sa ngayon, «DUE» kada sweldo.\n" +
     "3. Ang dues na hindi nakaltas ay ARREARS. Kapag hindi pa bayad pagkatapos ng payroll period, may surcharge na «SUR» sa bawat «BLOCK» na kulang (ang kulang na mas mababa sa «BLOCK» ay bilang na «BLOCK»), at nadadagdag ito kada period.\n" +
     "4. Ang sweldong pumasok hanggang «LATE» araw pagkatapos ng period ay ibinibilang sa period na iyon, at may «GRACE» araw na palugit para bayaran ang kulang.\n" +
     "5. Ang sobra ng sweldo ko pagkatapos ng kaltas ay ibinibigay sa akin (GCash o ayon sa napagkasunduan).\n" +
     "6. Ang bawat pagkilala sa passbook ko (slip, bagong utang, balanse at iba pa) ay ituturing kong TINANGGAP kapag wala akong pirma o tutol sa loob ng «ARAW» araw mula nang maipadala.\n" +
     "7. Naka-lock ang pirma ko at hindi na mababago o mabubura.\n" +
     "8. Pumapayag ako na itala at gamitin ng «CO» ang personal kong datos para lamang sa pautang na ito, ayon sa Data Privacy Act of 2012 (RA 10173).\n" +
     "9. Para sa akin lang ang link ng passbook ko, at hindi ko ito ibabahagi.",
  I: "Ako si «PANGALAN», co-investor ng «CO».\n" +
     "1. Kinikilala ko na hanggang «PETSA», ang puhunan ko ay «PUHUNAN».\n" +
     "2. Ang kita ko ay «RATE_INV» kada buwan ng puhunan ko, ibinibigay kada sweldo (kalahati tuwing ika-15 at katapusan ng buwan).\n" +
     "3. «BAWAS»\n" +
     "4. Sa ngayon, «IBIBIGAY» ang ibinibigay sa akin kada sweldo.\n" +
     "5. Makikita sa passbook ko ang bawat dagdag, bawas, payout, extra at singil, may petsa at oras.\n" +
     "6. Ang bawat pagkilala sa passbook ko ay ituturing kong TINANGGAP kapag wala akong pirma o tutol sa loob ng «ARAW» araw mula nang maipadala.\n" +
     "7. Naka-lock ang pirma ko at hindi na mababago o mabubura.\n" +
     "8. Pumapayag ako na itala at gamitin ng «CO» ang personal kong datos para lamang sa pamumuhunang ito, ayon sa Data Privacy Act of 2012 (RA 10173).\n" +
     "9. Para sa akin lang ang link ng passbook ko, at hindi ko ito ibabahagi.\n«KASAMA»",
  W: "Ako si «PANGALAN», taga-withdraw ng «CO».\n" +
     "1. Ang bayad sa akin ay «FEE_SWELDO» bawat withdraw ng SWELDO at «FEE_BONUS» bawat withdraw ng BONUS.\n" +
     "2. Iingatan ko ang lahat ng ipinagkakatiwala sa akin para sa withdraw (card, PIN at pera). Hindi ko ito ibabahagi kaninuman, at ibibigay ko nang buo ang na-withdraw sa «CO» sa araw ding iyon.\n" +
     "3. Makikita sa passbook ko ang bawat bayad, extra at singil, may petsa at oras.\n" +
     "4. Ang bawat pagkilala sa passbook ko ay ituturing kong TINANGGAP kapag wala akong pirma o tutol sa loob ng «ARAW» araw mula nang maipadala.\n" +
     "5. Naka-lock ang pirma ko at hindi na mababago o mabubura.\n" +
     "6. Pumapayag ako na itala at gamitin ng «CO» ang personal kong datos para lamang sa gawaing ito, ayon sa Data Privacy Act of 2012 (RA 10173).\n" +
     "7. Para sa akin lang ang link ng passbook ko, at hindi ko ito ibabahagi."
};
const AUTO = { K: "Kasunduan (isang beses)", S: "Slip kada sweldo", P: "Payout ng investor", W: "Bayad sa taga-withdraw", R: "Bagong utang", BN: "Bonus advance", X: "Extra na ibinigay", SG: "Extra singil" };

function fresh() {
  return { v: 1, created: Date.now(), updated: 0, days: 7, tpl: Object.assign({}, TPL), auto: { K: 1, S: 1, P: 1, W: 1, R: 1, BN: 1, X: 1, SG: 1 },
    views: [], accounts: {}, items: {}, seen: {}, form: formsDefault(), co: {}, asof: "", period: "", excelAt: 0 };
}

/* ---------- keys ---------- */
async function hmac(keyBytes, msg) { const k = await crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]); return new Uint8Array(await crypto.subtle.sign("HMAC", k, enc.encode(msg))); }
async function masterFrom(pass, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: RT.ub64u(salt), iterations: 310000, hash: "SHA-256" }, base, 256));
}
async function verifierOf() { return RT.b64u(await RT.sha(await hmac(MASTER, "verify"))); }

/* ---------- start ---------- */
async function boot() {
  try { const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) D = await r.json(); } catch (_) {}
  if (!window.crypto || !crypto.subtle) { app.innerHTML = "<section><p class=bad>Kailangang buksan ang page na ito sa https.</p></section>"; return; }
  lockView();
}
function lockView() {
  const first = !(D && D.verifier);
  app.innerHTML = '<section class="lock"><h2>' + (first ? "Gumawa ng lihim na password" : "Lihim na password") + "</h2>" +
    (first ? '<p class="muted">Ito ang susi ng lahat ng passbook. Ikaw lang ang dapat makaalam. Gawin itong mahaba, gaya ng isang pangungusap na madali mong tandaan (hindi bababa sa 12 letra). Isulat ito sa ligtas na lugar: kapag nawala ito, kailangang gumawa ng bagong links para sa lahat.</p>' : "") +
    '<label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">' +
    (first ? '<label for="pw2">Ulitin ang password</label><input type="password" id="pw2" autocomplete="new-password">' : "") +
    '<button class="btn pri full" id="unlock">' + (first ? "SIMULAN" : "BUKSAN") + '</button><p id="lk" class="muted"></p></section>';
  $("#pw").focus();
  const go = async () => {
    const pw = $("#pw").value;
    if (first) {
      if (pw.length < 12) return ($("#lk").textContent = "Masyadong maikli. Hindi bababa sa 12 letra.");
      if (pw !== $("#pw2").value) return ($("#lk").textContent = "Hindi pareho ang dalawang password.");
    }
    $("#lk").textContent = "Sandali lang…"; $("#unlock").disabled = true;
    const salt = D && D.salt ? D.salt : RT.b64u(crypto.getRandomValues(new Uint8Array(16)));
    MASTER = await masterFrom(pw, salt);
    const ver = await verifierOf();
    if (D && D.verifier && D.verifier !== ver) { MASTER = null; $("#unlock").disabled = false; return ($("#lk").textContent = "Mali ang password."); }
    AKEY = await RT.aesRaw((await hmac(MASTER, "admin")).slice(0, 32));
    ST = null;
    if (D && D.admin) { try { ST = await RT.open(AKEY, D.admin); } catch (_) {} }
    const draft = RT.get("rt:admin:draft", null);
    if (draft && draft.salt === salt && (!ST || draft.at > (ST.updated || 0))) {
      try { const x = await RT.open(AKEY, draft.box); ST = x; MSG = "Itinuloy ang mga pagbabagong hindi pa na-upload sa GitHub."; } catch (_) {}
    }
    if (!ST) ST = fresh();
    ST.salt = salt; ST.verifier = ver;
    await refreshLinks(); main();
  };
  $("#unlock").onclick = go; $("#pw").onkeydown = (e) => { if (e.key === "Enter" && !first) go(); };
}

async function draft() { ST.dirty = Date.now(); RT.put("rt:admin:draft", { at: ST.dirty, salt: ST.salt, box: await RT.seal(AKEY, ST) }); }

/* ---------- viewers & links ---------- */
function viewersOf(akey) { // from the Excel's PASSBOOK sheet: the holder first, then the KASAMA rows
  const A = ST.accounts[akey]; if (!A) return [];
  const own = (ST.views || []).filter((v) => v.akey === akey);
  const h = own.find((v) => v.holder) || { vkey: akey, name: A.name, role: A.type === "B" ? "Borrower" : A.type === "I" ? "Co-investor" : "Taga-withdraw", holder: true };
  return [h].concat(own.filter((v) => !v.holder)).map((v) => ({ key: v.vkey, name: v.name, role: v.role, holder: v.holder ? 1 : 0, link: v.key, ok: v.ok }));
}
function listed(A) { return A.status !== "WALA NA SA EXCEL" && (A.type !== "B" || A.status === "ACTIVE" || A.status === "FULLY PAID"); }
async function refreshLinks() {
  LINKS = {};
  for (const akey of Object.keys(ST.accounts)) for (const v of viewersOf(akey)) {
    if (!v.ok) continue;
    LINKS[v.key] = { link: v.link, pid: await RT.pidOf(v.link), name: v.name, akey, role: v.role };
  }
}

/* ---------- Excel ---------- */
// newer Excel wording -> the names used here (both versions of the Excel are read the same way)
const ALIAS = { "ADDITIONAL PAYOUT": "EXTRA BAYAD (itemized)", "ADDITIONAL CHARGE": "EXTRA SINGIL (itemized)", "WITHDRAWAL AGENT FEE": "BAYAD SA TAGA-WITHDRAW",
  "AWAITING SALARY": "HINIHINTAY", "NOT YET DUE": "PENDING" };
const canon = (x) => { const t = String(x == null ? "" : x).trim(); return ALIAS[t.toUpperCase()] || t; };
const REM_TL = { SALARY: "SWELDO", "CASH LOAN": "UTANG NA PERA", OTHERS: "IBA PA" };
const ROLE_TL = { "WITHDRAWAL AGENT": "Taga-withdraw", "AUTHORIZED USER": "Kasama" };
const roleTL = (x) => { const t = String(x == null ? "" : x).trim(); return ROLE_TL[t.toUpperCase()] || t; };
const FOR_TL = { "THE CHILDREN": "mga bata", CHILDREN: "mga bata" };
const forTL = (x) => { const t = String(x == null ? "" : x).trim(); return FOR_TL[t.toUpperCase()] || t; };
const remTL = (x) => { const t = String(x == null ? "" : x).trim(); return REM_TL[t.toUpperCase()] || t; };
const TL = {
  "PAYROLL COLLECTION": "Kaltas sa sweldo", "PAYMENT – REGULAR PRINCIPAL": "Bayad sa principal", "PAYMENT – REGULAR DUE": "Bayad sa dues / ARREARS",
  "PAYMENT – BONUS PRINCIPAL": "Bayad sa bonus advance", "PAYMENT – BONUS INTEREST": "Bayad sa bonus interest", "LOAN RELEASE – REGULAR": "Bagong utang",
  "OPENING – REGULAR LOAN": "Utang sa simula ng record", "ADJUSTMENT – REGULAR PRINCIPAL": "Adjustment sa utang", "ADJUSTMENT – REGULAR DUE": "Adjustment sa dues",
  "ADJUSTMENT – BONUS PRINCIPAL": "Adjustment sa bonus advance", "ADJUSTMENT – BONUS INTEREST": "Adjustment sa bonus interest", "EXTRA BAYAD (itemized)": "Extra mula sa RT LENDING CORP.",
  "EXTRA SINGIL (itemized)": "Extra singil", "INVESTOR CAPITAL IN": "Dagdag puhunan", "INVESTOR CAPITAL RETURN": "Ibinalik na puhunan", "INVESTOR PAYOUT": "Payout",
  "BAYAD SA TAGA-WITHDRAW": "Bayad sa withdraw"
};
const IN_TO_PERSON = new Set(["LOAN RELEASE – REGULAR", "EXTRA BAYAD (itemized)", "INVESTOR PAYOUT", "INVESTOR CAPITAL RETURN", "BAYAD SA TAGA-WITHDRAW"]);
const ymd = (s) => (typeof s === "number" ? new Date(Math.round((s - 25569) * 86400000)).toISOString().slice(0, 10) : null);
const hm = (s) => { if (typeof s !== "number") return "00:00"; const m = Math.round((s % 1) * 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const num = (x) => (typeof x === "number" ? x : 0);
const pct = (r) => (Math.round(r * 1000) / 10) + "%";
const short = (d) => { const [y, m, dd] = d.split("-").map(Number); return RT.MON[m - 1] + " " + dd; };

function readExcel(buf) {
  const wb = XLSX.read(buf, { type: "array", sheets: ["SETTINGS", "BORROWERS", "BONUSES", "LEDGER", "OWNERSHIP", "GRAPHDATA", "PASSBOOK"], cellFormula: false, cellHTML: false, cellText: false, cellStyles: false });
  const sh = (n) => { const w = wb.Sheets[n]; if (!w) throw new Error("Walang sheet na " + n + ". Ang RT LENDING SYSTEM Excel ba ito?"); return w; };
  const S = sh("SETTINGS"), B = sh("BORROWERS"), N = sh("BONUSES"), L = sh("LEDGER"), O = sh("OWNERSHIP"), G = sh("GRAPHDATA"), PB = sh("PASSBOOK");
  const v = (w, a) => (w[a] ? w[a].v : null);
  const must = [[B, "B5", "ID"], [B, "Q5", "REGULAR PRINCIPAL"], [L, "F5", "TYPE"], [L, "AE5", ["KABUUANG KALTAS", "TOTAL DEDUCTION"]], [N, "B5", "BONUS ID"], [O, "B59", "INVESTOR"], [G, "A3", "SLIP"], [PB, "B7", ["URI", "TYPE"]], [PB, "I7", "PASSBOOK KEY"]];
  must.forEach(([w, a, t]) => { const got = String(v(w, a) || "").toUpperCase(); if (![].concat(t).some((x) => got.startsWith(x))) throw new Error("Iba ang ayos ng Excel (" + a + "). Gamitin ang pinakabagong RT LENDING SYSTEM."); });
  const set = { co: v(S, "C6") || "RT LENDING CORP.", owner: v(S, "C7") || "", tagline: v(S, "C8") || "", asof: ymd(v(S, "C9")), activeP: ymd(v(S, "C12")), activeLbl: v(S, "C14") || "",
    rate: num(v(S, "C20")) || 0.025, sur: num(v(S, "C24")), block: num(v(S, "C25")), late: num(v(S, "C26")), grace: num(v(S, "C27")), pay: v(S, "C32") || "",
    feeSal: num(v(S, "C35")), feeBon: num(v(S, "C36")), invRate: num(v(S, "C38")) || 0.05, start: ymd(v(S, "C28")), wd: [] };
  for (let r = 6; r <= 15; r++) { const n = v(S, "Z" + r); if (n) set.wd.push(String(n).trim()); }
  const led = [];
  for (let r = 6; r <= 3005; r++) {
    if (typeof v(L, "C" + r) !== "number" || v(L, "W" + r) !== 1) continue;
    led.push({ r, txn: v(L, "B" + r), date: ymd(v(L, "C" + r)), time: hm(v(L, "D" + r)), party: String(v(L, "E" + r) || "").trim(), type: canon(v(L, "F" + r)), amt: num(v(L, "G" + r)),
      sal: num(v(L, "H" + r)), rem: remTL(v(L, "Q" + r)), id: v(L, "T" + r) || "", per: ymd(v(L, "V" + r)), ded: num(v(L, "AE" + r)), net: num(v(L, "AF" + r)) });
  }
  const bon = [];
  for (let r = 6; r <= 305; r++) {
    if (!v(N, "B" + r) || !v(N, "L" + r)) continue;
    bon.push({ bid: v(N, "B" + r), id: v(N, "L" + r), type: String(v(N, "D" + r) || "").split(" – ")[0], principal: num(v(N, "E" + r)), released: ymd(v(N, "F" + r)), time: hm(v(N, "G" + r)),
      paidThru: ymd(v(N, "H" + r)), source: v(N, "J" + r), left: num(v(N, "R" + r)), status: v(N, "V" + r) });
  }
  const accts = {};
  const stx = { PAID: "Bayad na", "BAYAD NA": "Bayad na", PARTIAL: "May kulang pa", HINIHINTAY: "Hinihintay ang sweldo", PENDING: "Hindi pa ang sweldo" };
  for (let r = 6; r <= 105; r++) {
    const id = v(B, "B" + r), name = String(v(B, "O" + r) || "").trim();
    if (!id || !name) continue;
    const seq = num(v(B, "AE" + r)), graph = [];
    if (seq >= 1 && seq <= 30) for (let k = 1; k <= 6; k++) { const rr = 3 + seq * 8 + k; if (typeof v(G, "C" + rr) === "number") graph.push({ label: String(v(G, "B" + rr) || ""), dapat: num(v(G, "C" + rr)), nakaltas: num(v(G, "D" + rr)) }); }
    const hist = led.filter((x) => x.id === id && TL[x.type]).map((x) => histRow(x, "B"));
    const ps = canon(v(B, "X" + r));
    accts["B|" + id] = { type: "B", key: "B|" + id, id, name, first: String(v(B, "E" + r) || "").trim(), status: String(v(B, "C" + r) || ""), school: v(B, "G" + r) || "", ratePct: pct(num(v(B, "P" + r)) || set.rate),

    if (!/\.csv$/i.test(name) || (meth !== 0 && meth !== 8)) continue;

    const bytes = meth === 0 ? raw : new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    out.push(new TextDecoder().decode(bytes));
  }

}

    ST.seen[key] = 1;
    if (d.k === "SIGN") { if (!it.sigs[who.name]) { it.sigs[who.name] = { at: d.at, path: d.svg, hash: d.hash, same: d.hash === (await RT.itemHash(it)) }; sig++; } }

      if (!m || r === m.r2) strokeEdge(ctx, bd.bottom, x0, y2, x2, y2);
      if (!m || c === m.c1) strokeEdge(ctx, bd.left, x0, y0, x0, y2);
      if (!m || c === m.c2) strokeEdge(ctx, bd.right, x2, y0, x2, y2);
    }
    // 3. text
    const filled = (c, r) => { const cell = sh.cells[colLet(c) + r]; return (cell && cell.v != null && cell.v !== "") || covered[c + "," + r] || top[c + "," + r]; };
    for (let r = ra; r <= rb; r++) for (const c of cols) {
      if (covered[c + "," + r] || !rh[r]) continue;
      const cell = sh.cells[colLet(c) + r];
      if (!cell || cell.v == null || cell.v === "") continue;
      const xf = cellXf(sh, c, r), font = B.fonts[xf.font] || B.fonts[0];
      const shown = cellText(cell.v, B.fmts[xf.fmt] || FMT0[xf.fmt] || "General");
      if (!shown.text) continue;
      const R = rectOf(c, r);
      let h = xf.h;
      if (h === "general") h = typeof cell.v === "number" ? "right" : typeof cell.v === "boolean" ? "center" : "left";
      if (h === "centerContinuous" || h === "distributed") h = "center";
      if (h === "fill" || h === "justify") h = "left";
      let scale = 1;
      ctx.font = fontCss(font);
      const ind = xf.indent * 9;
      let avail = R.w - 2 * PAD - ind;
      let lines = xf.wrap ? wrapLines(ctx, shown.text, Math.max(8, avail)) : [shown.text.replace(/\r?\n/g, " ")];
      let clip = { x: R.x, w: R.w };
      if (!xf.wrap) {
        const tw = ctx.measureText(lines[0]).width;
        if (xf.shrink && tw > avail) { scale = Math.max(0.5, avail / tw); ctx.font = fontCss(font, scale); }
        else if (tw > avail && !top[c + "," + r]) {
          let L = R.x, Rr = R.x + R.w, need = tw - avail;
          if (h === "left") { for (let q = c + 1; q <= A.c2 && need > 0 && !filled(q, r); q++) { Rr += cw[q]; need -= cw[q]; } }
          else if (h === "right") { for (let q = c - 1; q >= A.c1 && need > 0 && !filled(q, r); q--) { L -= cw[q]; need -= cw[q]; } }
          else { for (let q = 1; need > 0; q++) { const okL = c - q >= A.c1 && !filled(c - q, r), okR = c + q <= A.c2 && !filled(c + q, r); if (!okL || !okR) break; L -= cw[c - q]; Rr += cw[c + q]; need -= cw[c - q] + cw[c + q]; } }
          clip = { x: L, w: Rr - L };
        }
      }
      const px = font.sz * PT * scale, lh = px * 1.18, asc = px * 0.78, desc = px * 0.22;
      const blockH = lines.length * lh - (lh - px);
      let y0;
      if (xf.v === "top") y0 = R.y + PAD - 1;
      else if (xf.v === "center" || xf.v === "distributed" || xf.v === "justify") y0 = R.y + (R.h - blockH) / 2;
      else y0 = R.y + R.h - PAD + 1 - blockH;
      ctx.save();
      ctx.beginPath(); ctx.rect(clip.x, R.y, clip.w, R.h); ctx.clip();
      ctx.fillStyle = shown.color || font.color || "#000000"; ctx.textBaseline = "alphabetic";
      lines.forEach((ln, i) => {
        const tw = ctx.measureText(ln).width, base = y0 + i * lh + asc + (px - asc - desc) / 2;
        let tx;
        if (h === "right") { ctx.textAlign = "right"; tx = R.x + R.w - PAD - ind; }
        else if (h === "center") { ctx.textAlign = "center"; tx = R.x + R.w / 2; }
        else { ctx.textAlign = "left"; tx = R.x + PAD + ind; }
        ctx.fillText(ln, tx, base);
        if (font.u) { const ux = h === "right" ? tx - tw : h === "center" ? tx - tw / 2 : tx; ctx.fillRect(ux, base + 1.5, tw, Math.max(0.8, px / 14)); }
      });
      ctx.restore();
    }
    // 4. pictures and charts
    for (const o of sh.objs) {
      if (!o.from) continue;
      const x = allColX(o.from.col + 1) + o.from.colOff / EMU, y = allRowY(o.from.row + 1) + o.from.rowOff / EMU;
      let w = o.cx / EMU, hgt = o.cy / EMU;
      if (o.to) { w = allColX(o.to.col + 1) + o.to.colOff / EMU - x; hgt = allRowY(o.to.row + 1) + o.to.rowOff / EMU - y; }
      if (y + hgt <= 0 || y >= H || w <= 0 || hgt <= 0) continue;
      if (o.kind === "img") { const im = await imgOf(o.path); if (im) ctx.drawImage(im, x, y, w, hgt); }
      else { try { drawChart(ctx, await chartOf(o.path), x, y, w, hgt); } catch (_) {} }
    }
    // 5. page footer
    if (fh) {
      const fy = H + M - 4, fpx = Math.max(9, ft.size * PT * 1.15);
      const sub = (t) => t.replace(/\u0001/g, String(pi + 1)).replace(/\u0002/g, String(pages.length)).trim();
      ctx.font = fpx.toFixed(1) + "px Arial,'Liberation Sans',Roboto,sans-serif"; ctx.fillStyle = "#374151"; ctx.textBaseline = "alphabetic";
      if (ft.L) { ctx.textAlign = "left"; ctx.fillText(sub(ft.L), 0, fy); }
      if (ft.C) { ctx.textAlign = "center"; ctx.fillText(sub(ft.C), W / 2, fy); }
      if (ft.R) { ctx.textAlign = "right"; ctx.fillText(sub(ft.R), W, fy); }
    }
    out.push(cv);
  }
  return out;
}

const sheetPick = (...names) => names.find((n) => SX.book.sheets[n]);
async function cellV(sheet, ref) { const sh = await sheetOpen(sheet); const c = sh && sh.cells[ref]; return c ? c.v : null; }

const dTag = (d) => (d ? MON3[d.getUTCMonth()] + " " + d.getUTCDate() + " " + d.getUTCFullYear() : "");
const pTag = (a, b) => (!a || !b ? dTag(a || b) : a.getUTCMonth() === b.getUTCMonth() && a.getUTCFullYear() === b.getUTCFullYear()
  ? MON3[a.getUTCMonth()] + " " + a.getUTCDate() + "-" + b.getUTCDate() + " " + a.getUTCFullYear()
  : MON3[a.getUTCMonth()] + " " + a.getUTCDate() + "-" + MON3[b.getUTCMonth()] + " " + b.getUTCDate() + " " + b.getUTCFullYear());
const MONW = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const pWords = (a, b) => a.getUTCMonth() === b.getUTCMonth() && a.getUTCFullYear() === b.getUTCFullYear()
  ? MONW[a.getUTCMonth()] + " " + a.getUTCDate() + "–" + b.getUTCDate() + ", " + a.getUTCFullYear()
  : MONW[a.getUTCMonth()] + " " + a.getUTCDate() + " – " + MONW[b.getUTCMonth()] + " " + b.getUTCDate() + ", " + b.getUTCFullYear();
const fileSafe = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[.,]/g, "").replace(/[^A-Za-z0-9 \-]/g, " ").replace(/\s+/g, " ").trim().toUpperCase();

const firstName = (n) => {
  const t = String(n || "").trim().split(/\s+/);
  if (/^MA\.?$/i.test(t[0] || "") && t[1]) return "Ma " + properW(t[1]);
  return (t[0] || "").length <= 2 ? (t[0] || "") : properW(t[0]);
};
async function slipList() {

  }

}
